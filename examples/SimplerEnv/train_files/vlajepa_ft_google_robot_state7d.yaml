run_id: simpler_ft_google_robot_state7d_Qwen3.5_2B_plus
run_root_dir: checkpoints/direct_ft/oxe
seed: 42
trackers:
- json
is_debug: false
framework:
  name: VLA_JEPA
  qwenvl:
    base_vlm: /data/WangBizi/VLA_JEPA_models/Qwen3.5-2B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    use_state_encoder: false
    future_action_window_size: 6
    action_horizon: 7
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vj2_model:
    base_encoder: /data/WangBizi/VLA_JEPA_models/vjepa2-vitl-fpc64-256
    depth: 12
    num_heads: 8
    special_action_token: <|action_{}|>
    num_action_tokens_per_timestep: 3
    embodied_action_token: <|embodied_action|>
    num_embodied_action_tokens_per_instruction: 32
    enable_future_tokens: true
    special_future_token: <|future_{}|>
    num_frames: 8
  vlanext_conditioning:
    use_proprio_input_vlm: true
    use_soft_connector: true
    connector_depth: 2
    connector_num_heads: 4
    connector_mlp_ratio: 4.0
    dct_loss_weight: 0.1
    dct_freq_split: 0.125
    dct_low_freq_weight: 5.0
    dct_high_freq_weight: 0.0
  reduce_in_full_precision: true
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /data/WangBizi/dataset
    data_mix: google_robot
    action_type: delta_ee
    CoT_prompt: "Your task is {instruction}. Infer the temporal dynamics from frames {actions} and produce the corresponding policy actions {e_actions}."
    resolution_size: 224
    video_resolution_size: 256
    per_device_batch_size: 32
    load_all_data_for_training: true
    action_horizon: 7
    with_state: true
    state_history_len: 8
    proprio_encoding: vla_jepa_7d
    delete_pause_frame: false
    sample_without_replacement: true
    shuffle: true
    preprocess_vj_inputs_in_collate: true
    preprocess_qwen_inputs_in_collate: true
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    augmentation:
      enabled: true
      probability: 0.5
      camera_aug_policy: all
      random_resized_crop:
        scale: [0.9, 1.0]
        ratio: [0.95, 1.05]
      random_affine:
        translate: [0.2, 0.08]
        scale: [0.9, 1.1]
        degrees: [-3.0, 3.0]
        probability: 0.7
      random_brightness: [0.15]
      random_contrast: [0.9, 1.1]
      random_saturation: [0.9, 1.1]
      random_hue: [0.03]
      augment_order:
        - random_resized_crop
        - random_affine
        - random_brightness
        - random_contrast
        - random_saturation
        - random_hue

trainer:
  enable_torch_compile: false
  torch_compile_mode: reduce-overhead
  torch_compile_modules: [vj_predictor, action_dit_blocks]
  torch_compile_fullgraph: false
  torch_compile_dynamic: false
  torch_compile_threads: 4
  enable_tf32: true
  float32_matmul_precision: high
  enable_fast_sdp: true
  skip_qwen_lm_head: true

  epochs: 100
  max_train_steps: 30000
  num_warmup_steps: 3500
  save_interval: 2500
  eval_interval: 1000
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
    future: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10000
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  pretrained_checkpoint: /home/WangBizi/VLA-JEPA/checkpoints/cotrain_future_QWen3.5_2B/checkpoints/steps_30000_pytorch_model.pt
  ignore_mismatched_pretrained: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_from_checkpoint: null
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: false
  enable_detailed_timing: true
  enable_mixed_precision_training: true
